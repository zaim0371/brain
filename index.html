const RETRY=[404,429,500,503,504];
async function gen(msgs,o={}){
  const stop=()=>{const e=new Error("stop");e.name="AbortError";e.userStop=true;return e};
  if(o.sig&&o.sig.aborted)throw stop();
  const st=o.onStatus||(()=>{});
  const body={contents:msgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),generationConfig:{thinkingConfig:{thinkingBudget:0}}};
  const gc=body.generationConfig;if(o.json)gc.responseMimeType="application/json";if(o.temp!=null)gc.temperature=o.temp;
  const post=async m=>{
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),o.tmo||40000);
    if(o.sig)o.sig.addEventListener("abort",()=>ac.abort(),{once:true});
    try{
      const go=()=>fetch(API+"models/"+m+":generateContent",{method:"POST",signal:ac.signal,headers:{"Content-Type":"application/json","x-goog-api-key":KEY},body:JSON.stringify(body)});
      let r=await go();
      if(r.status===400&&gc.thinkingConfig){delete gc.thinkingConfig;r=await go()}
      return r}
    finally{clearTimeout(tm)}};
  const list=[...new Set([MODEL,"gemini-flash-latest","gemini-flash-lite-latest"])];let last;
  for(const m of list){
    st({t:"Mengirim…"});
    try{
      const r=await post(m);
      if(r.ok){const j=await r.json();return((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("")}
      let dt="";try{dt=((await r.json()).error||{}).message||""}catch(_){}
      const e=new Error("http");e.status=r.status;e.detail=dt.slice(0,140);last=e;
      if(!RETRY.includes(r.status))throw e;
      st({t:"Server sibuk, ganti model…"});
    }catch(err){
      if(o.sig&&o.sig.aborted){err.userStop=true;throw err}
      if(err.status&&!RETRY.includes(err.status))throw err;
      last=err}}
  if(last&&!last.status)last.net=true;throw last}

// baca JSON dari AI; kalau terpotong, ambil bagian yang masih utuh
function parseLoose(raw){
  const t=String(raw==null?"":raw).replace(/```json|```/g,"").trim();
  try{const d=JSON.parse(t);if(d&&typeof d==="object")return d}catch(e){}
  const d={soal:[]};
  const jm=/"judul"\s*:\s*"((?:[^"\\]|\\.)*)"/.exec(t);if(jm){try{d.judul=JSON.parse('"'+jm[1]+'"')}catch(e){}}
  const pm=/"poin"\s*:\s*\[((?:[^\]"]|"(?:[^"\\]|\\.)*")*)\]/.exec(t);if(pm){try{d.poin=JSON.parse("["+pm[1]+"]")}catch(e){}}
  const si=t.indexOf('"soal"');
  if(si>=0){const a=t.indexOf("[",si);let dp=0,st=-1,inS=false,es=false;
    for(let i=a+1;a>=0&&i<t.length;i++){const ch=t[i];
      if(inS){if(es)es=false;else if(ch==="\\")es=true;else if(ch==='"')inS=false;continue}
      if(ch==='"'){inS=true;continue}
      if(ch==="{"){if(dp===0)st=i;dp++}
      else if(ch==="}"){dp--;if(dp===0&&st>=0){try{d.soal.push(JSON.parse(t.slice(st,i+1)))}catch(e){}st=-1}}
      else if(ch==="]"&&dp===0)break}}
  return d;
}
// rapikan satu soal; terima jawaban berupa angka, "2", "B", atau teks pilihan
function normQ(it){
  if(!it||typeof it!=="object")return null;
  const q=QT(it.q||it.question||it.soal||"",300);
  let op=it.options||it.opsi||it.pilihan;
  if(!q||!Array.isArray(op))return null;
  op=op.map(o=>QT(o&&typeof o==="object"?(o.text||o.t||o.label||""):o,160));
  if(op.some(x=>!x))return null;
  op=op.slice(0,4);
  if(op.length<2||new Set(op.map(x=>x.toLowerCase())).size!==op.length)return null;
  const a=it.answer!=null?it.answer:it.jawaban;let idx=-1;
  if(typeof a==="number"&&isFinite(a))idx=Math.round(a);
  else if(typeof a==="string"){const s=a.trim();
    if(/^\d+$/.test(s))idx=+s;
    else if(/^[A-Da-d][.)]?$/.test(s))idx=s.toUpperCase().charCodeAt(0)-65;
    else idx=op.findIndex(x=>x.toLowerCase()===s.toLowerCase())}
  if(idx<0||idx>=op.length)return null;
  return{q,options:op,answer:idx,exp:QT(it.exp||it.penjelasan||"",260)};
}
// minta materi ke AI: streaming dulu (tidak kena batas waktu menunggu), cadangan non-streaming
async function ask(p,ac,plain,say){
  const base={json:true,temp:1,tmo:40000,sig:ac.signal,onStatus:s=>{if(s&&s.t)say(s.t)}};
  const need=S.pts*70+Math.min(S.pts+4,14)*240;
  if(plain)return gen([{role:"user",content:p}],{...base,tmo:60000});
  try{return await gen([{role:"user",content:p}],{...base,stream:true,onText:t=>say("AI menulis materi… "+Math.min(99,Math.round(String(t).length/need*100))+"%")})}
  catch(e){if(ac.signal.aborted||(e&&e.status))throw e;return gen([{role:"user",content:p}],{...base,tmo:60000})}
}

function pickKind(){const k=["bentuk","lacak","kartu"].filter(x=>x!==B.lastKind);return k[rnd(k.length)]}
const SHH=[];
function shSeq(l,m){
  const pl=SHPOOL(l),base=x=>x.startsWith("e:")?x:x.split(".")[0];

    if(t<40){let adj=false;for(let i=1;i<c.length;i++)if(base(c[i])===base(c[i-1])){adj=true;break}if(adj)continue}
    const key=c.join("|");

    s=c}

  while(o.length<n){const x=pl[rnd(pl.length)];if(o[o.length-1]===x)continue;o.push(x)}return o}

(()=>{

function parseJ(raw){const t=String(raw==null?"":raw).replace(/```json|```/g,"").trim();

function ev(s){
  s=String(s==null?"":s).replace(/\s+/g,"").replace(/[×·]/g,"*").replace(/[÷:]/g,"/").replace(/[−–]/g,"-");
  if(s.indexOf(".")<0)s=s.replace(/,/g,".");
  if(!s||/[^0-9+\-*/^().%]/.test(s))return NaN;
  let p=0;
  const E=()=>{let v=T();while(s[p]==="+"||s[p]==="-"){const o=s[p++],r=T();v=o==="+"?v+r:v-r}return v};
  const T=()=>{let v=U();while(s[p]==="*"||s[p]==="/"){const o=s[p++],r=U();v=o==="*"?v*r:v/r}return v};
  const U=()=>{if(s[p]==="-"){p++;return -U()}if(s[p]==="+"){p++;return U()}return W()};
  const W=()=>{const b=A();if(s[p]==="^"){p++;return Math.pow(b,U())}return b};
  const A=()=>{let v;if(s[p]==="("){p++;v=E();if(s[p]!==")")throw 0;p++}else{const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(p));if(!m)throw 0;v=parseFloat(m[0]);p+=m[0].length}while(s[p]==="%"){p++;v/=100}return v};
  try{const v=E();return p===s.length&&isFinite(v)?v:NaN}catch(e){return NaN}
}

  B.ph="play";
  el.innerHTML='<div class="q glass mg"><div class="brprog"><span id="mgn"></span><span id="mgs"></span></div><div class="mgstory" id="mgst" style="display:none"></div>'
   +'<div class="mgw"><svg class="mgr" viewBox="0 0 100 100" aria-hidden="true"><circle class="mgt" cx="50" cy="50" r="48"/><circle class="mgp" id="mgp" cx="50" cy="50" r="48" pathLength="100"/></svg>'
   +'<div class="mgd" id="mgd">'+[0,1,2,3].map(i=>'<button type="button" class="mgo" data-i="'+i+'"></button>').join("")+'<div class="mgq" id="mgq"></div></div></div>'
   +'<div class="brbtns"><button type="button" class="chip" id="mgx">Berhenti</button></div></div>'}
function showQ(){
  const q=B.q=nextQ();B.lock=false;B.t0=performance.now();
  $("mgn").textContent="Soal "+(B.i+1)+" dari "+B.N;$("mgs").textContent="Benar "+B.sc+(B.streak>1?" · beruntun "+B.streak:"");
  const st=$("mgst");st.style.display=q.story?"":"none";if(q.story)st.textContent=q.q;
  const pl=$("mgq"),tx=q.story?"= ?":q.q;pl.textContent=tx;pl.style.setProperty("--fs",Math.min(1,9/tx.length).toFixed(2));
  el.querySelectorAll(".mgo").forEach((b,k)=>{b.textContent=q.o[k];b.className="mgo";b.disabled=false});
  const rg=$("mgp");rg.classList.remove("run");rg.style.animationPlayState="";void rg.getBoundingClientRect();rg.style.setProperty("--t",q.t+"s");rg.classList.add("run");
  const d=$("mgd");d.classList.remove("in");void d.offsetWidth;d.classList.add("in");
  stopT();B.tm=setTimeout(()=>{if(!el.getClientRects().length){setup();return}pick(-1)},q.t*1000)}
function pick(i){
  if(B.ph!=="play"||B.lock)return;B.lock=true;stopT();
  const q=B.q,ok=i>=0&&q.o[i]===q.ans,bs=[...el.querySelectorAll(".mgo")];
  bs.forEach(b=>b.disabled=true);bs[q.o.indexOf(q.ans)].classList.add("ok");if(i>=0&&!ok)bs[i].classList.add("no");
  $("mgp").style.animationPlayState="paused";
  B.res.push({ok,to:i<0,t:+Math.min(q.t,(performance.now()-B.t0)/1000).toFixed(1),lim:q.t});
  if(ok){B.sc++;B.streak++;B.best=Math.max(B.best,B.streak);sfx("ok")}else{B.streak=0;sfx("no");try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
  const tok=B.tok;
  B.tm=setTimeout(()=>{if(B.tok!==tok||B.ph!=="play")return;B.i++;if(B.i>=B.N)finish();else if(!el.getClientRects().length)setup();else showQ()},ok?650:1200)}

// ---- XP: patokan lokal, lalu AI yang menyesuaikan ----
function fbXp(){
  let x=0,s=0;
  B.res.forEach(r=>{if(r.ok){s++;x+=8+(r.t<=r.lim*.4?4:0)+Math.min(6,s-1)}else{s=0;x-=r.to?5:7}});
  return Math.max(-60,Math.min(160,Math.round(x*(1+(P.lv-1)*.04))))}
async function aiXp(fb,sig){
  const rs=B.res,to=rs.filter(r=>r.to).length,wr=rs.filter(r=>!r.ok&&!r.to).length,avg=(rs.reduce((a,r)=>a+r.t,0)/rs.length).toFixed(1);
  const nm=OPS.find(o=>o[0]===B.op)[1];
  const p="Kamu pelatih game matematika. Tentukan perubahan XP pemain untuk satu sesi.\nData: jenis soal "+nm+", level "+P.lv+", XP sekarang "+P.xp+"/"+need(P.lv)+", benar "+B.sc+" dari "+B.N+", salah "+wr+", habis waktu "+to+", rata-rata waktu menjawab "+avg+" detik (batas "+(rs[0]?rs[0].lim:0)+" detik), beruntun terbaik "+B.best+".\nAturan: XP naik bila akurat dan cepat, lebih besar untuk beruntun panjang dan level tinggi; turun bila banyak salah atau habis waktu; penalti kecil untuk level 1 sampai 2. Rentang -40 sampai 150. Patokan kasar: "+fb+".\nHasilkan JSON saja: {\"xp\":bilangan bulat,\"note\":satu kalimat semangat bahasa Indonesia maksimal 90 karakter}.";
  const d=parseJ(await gen([{role:"user",content:p}],{json:true,tmo:10000,temp:.5,sig,att:3,nr:1}));
  const x=Math.round(+d.xp);if(!isFinite(x))throw new Error("xp");
  return{xp:Math.max(Math.max(-40,fb-30),Math.min(Math.min(150,fb+40),x)),note:String(d.note||"").replace(/\s+/g," ").trim().slice(0,100)}}
function logSess(snap,op,sc,N,delta){
  try{const a=applyTo(snap,delta);sbx("math_game_log","POST",[uw({op,level:snap.lv,correct:sc,total:N,xp_delta:delta,level_after:a.lv,xp_after:a.xp})],"return=minimal").catch(()=>{})}catch(e){}}
function finish(){
  stopT();B.ph="res";const tok=B.tok,snap={lv:P.lv,xp:P.xp},fb=fbXp(),op=B.op,sc=B.sc,N=B.N;
  B.snap=snap;B.delta=fb;B.note="";B.pend=!!KEY;
  const set=d=>{const a=applyTo(snap,d);P.lv=a.lv;P.xp=a.xp};
  set(fb);P.n=(P.n||0)+1;P.best=Math.max(P.best||0,B.best);saveP();sfx(sc>=7?"win":"no");renderRes(true);
  if(!KEY){logSess(snap,op,sc,N,fb);return}
  const ac=B.ac=new AbortController();
  aiXp(fb,ac.signal).then(r=>{
    if(B.tok!==tok)return;B.delta=r.xp;B.note=r.note;set(r.xp);saveP();B.pend=false;if(B.ph==="res")renderRes(false);logSess(snap,op,sc,N,r.xp)
  }).catch(()=>{if(B.tok!==tok)return;B.pend=false;if(B.ph==="res")renderRes(false);logSess(snap,op,sc,N,fb)})}
function renderRes(first){
  const s=B.snap,r=applyTo(s,B.delta),d=B.delta,pct=Math.round(B.sc/B.N*100),nd=need(r.lv),w1=Math.round(r.xp/nd*100),w0=r.up?0:Math.round(s.xp/need(s.lv)*100);
  el.innerHTML='<div class="q glass mg'+(first?"":" noan")+'"><div class="brbig">'+B.sc+'/'+B.N+'</div><div class="brmsg">'+pct+'% benar'+(B.best>1?' · beruntun terbaik '+B.best:'')+'</div>'
   +'<div class="mgxp" style="margin-top:14px"><div class="mgxh"><b>Level '+r.lv+'</b><span class="'+(d>=0?"up":"dn")+'">'+(d>=0?"+":"")+d+' XP</span></div><div class="mgb"><i id="mgbi" style="width:'+(first?w0:w1)+'%"></i></div><div class="mgxs">'+r.xp+' / '+nd+' XP</div>'+(r.up?'<div class="mgup">Naik level!</div>':'')+'</div>'
   +'<div class="mgnote">'+(B.note?esc(B.note):B.pend?"AI sedang menilai permainanmu…":"")+'</div>'
   +'<div class="brbtns"><button type="button" class="chip" id="mgback">Ganti soal</button><button type="button" class="chip on" id="mgagain">Main lagi</button></div></div>';
  if(first)requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$("mgbi");if(b)b.style.width=w1+"%"}))}

// ---- mulai ----
async function start(op){
  if(B.gen)return;stopT();B.tok++;const tok=B.tok;
  Object.assign(B,{op,i:0,N:10,sc:0,streak:0,best:0,res:[],pool:[],ac:null});
  const hist=zHist("mg");let pool=null;
  if(KEY){
    B.gen=true;const ac=B.ac=new AbortController();
    el.innerHTML='<div class="q glass brload"><i></i><div style="font-weight:600">AI menyiapkan soal…</div><div class="brbtns" style="justify-content:center"><button type="button" class="chip" id="mgabort" style="flex:none;padding:10px 22px">Batal</button></div></div>';
    try{pool=await aiPool(op,P.lv,hist,ac.signal)}
    catch(e){if(ac.signal.aborted){if(B.tok===tok){B.gen=false;setup()}return}toast("AI sedang sibuk, memakai soal cadangan",2400)}
    B.gen=false;if(B.tok!==tok)return}
  B.pool=pool||localPool(op,P.lv,hist);
  zRem("mg",B.pool.map(x=>x.q),80);
  shell();showQ()}

el.addEventListener("click",e=>{
  const op=e.target.closest(".mgop");if(op&&el.contains(op)){start(op.dataset.op);return}
  const o=e.target.closest(".mgo");if(o&&el.contains(o)){pick(+o.dataset.i);return}
  const c=e.target.closest(".chip");if(!c||!el.contains(c))return;
  if(c.id==="mgx")zGame.ask("m");else if(c.id==="mgabort"){if(B.ac)B.ac.abort()}else if(c.id==="mgback")setup();else if(c.id==="mgagain")start(B.op)});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&(B.ph==="play"||B.gen))setup()});

// sinkron profil dari database (ambil yang lebih baru)
(async()=>{try{const r=await sbx("app_settings?select=value&key=eq.math_game"+(UID()?"&user_id=eq."+UID():"&device_id=eq."+DEV));
  const v=r&&r[0]&&r[0].value,o=typeof v==="string"?JSON.parse(v):v;
  if(o&&typeof o==="object"&&(o.ts||0)>(P.ts||0)){P={...P,...o};try{localStorage.setItem(K,JSON.stringify(P))}catch(e){}if(B.ph==="setup")setup()}
  else if(!o&&P.ts)putLater("math_game",()=>JSON.stringify(P),800)}catch(e){}})();

function mode(m){
  seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.bm===m));
  $("br").style.display=m==="h"?"":"none";el.style.display=m==="m"?"":"none";$("bri").style.display=m==="i"?"":"none";
  seg.style.display=m==="m"?"none":"";$("gtitle").textContent=m==="m"?"Math":"Memory";
  if(m!=="m"&&(B.ph==="play"||B.gen))setup();
}
seg.addEventListener("click",e=>{const b=e.target.closest("button[data-bm]");if(b)mode(b.dataset.bm)});
window.brMode=mode;
setup();mode("i");
zGame.reg("m",el,()=>B,()=>setup());
})();
// ---------- navigasi & progres harian ----------
(()=>{
const DK="zb-daily",GOAL=10,td=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let DP={d:td(),n:0};try{const o=JSON.parse(localStorage.getItem(DK)||"null");if(o&&o.d===td()&&o.n>=0)DP=o}catch(e){}
function paint(){if(DP.d!==td())DP={d:td(),n:0};$("dpn").textContent=String(Math.min(DP.n,99)).padStart(2,"0")+" / "+GOAL;$("dpb").style.width=Math.min(100,DP.n/GOAL*100)+"%"}
window.brDone=()=>{if(DP.d!==td())DP={d:td(),n:0};DP.n++;try{localStorage.setItem(DK,JSON.stringify(DP))}catch(e){}paint()};
const vh=$("vh"),vg=$("v4");
function go(k){vh.classList.remove("show");vg.classList.add("show");brMode(k==="math"?"m":"i");zGame.sync()}
function home(){vg.classList.remove("show");vh.classList.add("show");paint();zGame.sync()}
document.querySelector(".tiles").addEventListener("click",e=>{const t=e.target.closest(".tile");if(!t)return;sfx("click");const g=t.dataset.g;
  if(g==="memory"||g==="math")go(g);else toast((g==="logic"?"Logic":"Reaction")+" segera hadir",2000)});
$("gback").onclick=home;$("hkey").onclick=()=>{sfx("click");openSet()};
paint();
})();
</script>
